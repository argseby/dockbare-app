services:
  dockbare:
    image: fluttered/dockbare:latest
    build: .
    container_name: dockbare
    restart: unless-stopped
    env_file:               # .env for a local checkout, stack.env when deployed as a Portainer git stack
      - path: .env
        required: false
      - path: stack.env
        required: false
    ports:
      # Bind to localhost and put a TLS reverse proxy (Traefik, Caddy, nginx) in front.
      # Override with DOCKBARE_BIND (e.g. 127.0.0.1:5001 or 0.0.0.0:5000 to expose directly).
      - "${DOCKBARE_BIND:-127.0.0.1:5000}:5000"
    volumes:
      - ./backups:/backups    # use absolute host paths under Portainer
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ:-UTC}
