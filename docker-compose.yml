services:
  dockbare:
    # Built from this checkout on every "up" (pull_policy: build), so a git update always lands.
    build: .
    image: dockbare:${DOCKBARE_BUILD:-local}
    pull_policy: build
    container_name: dockbare
    restart: unless-stopped
    env_file:               # .env for a local checkout, stack.env when deployed as a Portainer git stack
      - path: .env
        required: false
      - path: stack.env
        required: false
    ports:
      # DOCKBARE_PORT is the port inside and outside (default 5000); DOCKBARE_BIND the host address
      # (127.0.0.1 = only via a reverse proxy on this machine, 0.0.0.0 = exposed directly).
      - "${DOCKBARE_BIND:-127.0.0.1}:${DOCKBARE_PORT:-5000}:${DOCKBARE_PORT:-5000}"
    volumes:
      # Named Docker volumes by default (dockbare_data / dockbare_backups). They survive every redeploy,
      # including Portainer git-stack updates, which check out the repo into a NEW directory each time
      # (a relative ./data would start empty after every update: remotes, schedules, 2FA all gone).
      # Prefer host directories? Set DOCKBARE_BACKUPS_PATH / DOCKBARE_DATA_PATH to ABSOLUTE paths.
      - ${DOCKBARE_BACKUPS_PATH:-dockbare_backups}:/backups
      - ${DOCKBARE_DATA_PATH:-dockbare_data}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ:-UTC}
    networks:
      - proxy

networks:
  # Set PROXY_NETWORK to the existing network of your reverse proxy (e.g. proxy-network);
  # without it the container simply uses Docker's default bridge network.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-bridge}

volumes:
  # Fixed names (not prefixed with the project/stack name) so the data is easy to find and reuse.
  # Unused when DOCKBARE_*_PATH point at host directories.
  dockbare_data:
    name: ${DOCKBARE_DATA_VOLUME:-dockbare_data}
    labels:
      dev.dockbare.internal: "1"
  dockbare_backups:
    name: ${DOCKBARE_BACKUPS_VOLUME:-dockbare_backups}
    labels:
      dev.dockbare.internal: "1"
