services:
  dockbare:
    image: fluttered/dockbare:latest
    build: .
    container_name: dockbare
    restart: unless-stopped
    env_file: .env          # Portainer git stacks: use "env_file: stack.env" and the stack's environment variables
    ports:
      # Bind to localhost and put a TLS reverse proxy (Traefik, Caddy, nginx) in front.
      # Change to "5000:5000" only if you really want to expose it directly.
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backups:/backups    # use absolute host paths under Portainer
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ:-UTC}
