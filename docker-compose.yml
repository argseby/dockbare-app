services:
  dockbare:
    # Built from this checkout. Bump DOCKBARE_BUILD (any new value) to force a rebuild after a git update.
    build: .
    image: dockbare:${DOCKBARE_BUILD:-local}
    container_name: dockbare
    restart: unless-stopped
    env_file:               # .env for a local checkout, stack.env when deployed as a Portainer git stack
      - path: .env
        required: false
      - path: stack.env
        required: false
    ports:
      # DOCKBARE_PORT is the port inside and outside (default 5000); DOCKBARE_BIND the host address
      # (127.0.0.1 = only via a reverse proxy on this machine, 0.0.0.0 = exposed directly).
      - "${DOCKBARE_BIND:-127.0.0.1}:${DOCKBARE_PORT:-5000}:${DOCKBARE_PORT:-5000}"
    volumes:
      - ./backups:/backups    # use absolute host paths under Portainer
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ:-UTC}
    networks:
      - proxy

networks:
  # Set PROXY_NETWORK to the existing network of your reverse proxy (e.g. proxy-network);
  # without it the container simply uses Docker's default bridge network.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-bridge}
