# Portainer (git stack) variant.
# - Put the variables from .env.example into the stack's "Environment variables"; Portainer
#   writes them to stack.env, which is handed to the container below.
# - Use absolute host paths for /backups and /data so a redeploy or a new stack finds the same files.
# - DOCKBARE_BEHIND_PROXY=true when a reverse proxy (Traefik/Caddy/nginx) terminates TLS.
services:
  dockbare:
    build: .                                   # built from this repo by Portainer; or use image: <registry>/dockbare:3
    container_name: dockbare
    restart: unless-stopped
    env_file: stack.env
    volumes:
      - /srv/dockbare/backups:/backups          # <- change to the host path of your existing backups
      - /srv/dockbare/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy-network                           # your reverse-proxy network (same as the old stack)
    # Only if you access it without a reverse proxy:
    # ports:
    #   - "127.0.0.1:5000:5000"
    # Example Traefik labels (adjust router name, host and entrypoint):
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.dockbare.rule=Host(`backup.example.com`)
    #   - traefik.http.routers.dockbare.entrypoints=websecure
    #   - traefik.http.routers.dockbare.tls.certresolver=letsencrypt
    #   - traefik.http.services.dockbare.loadbalancer.server.port=5000

networks:
  proxy-network:
    external: true
