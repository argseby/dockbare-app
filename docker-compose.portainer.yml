# Portainer (git stack) variant.
# Everything you may need to change comes from the stack's environment variables (Portainer writes
# them to stack.env, which is also handed to the container). Defaults are in ${VAR:-default}.
#
#   PROXY_NETWORK          existing proxy-network network to join      (default: proxy-network)
#   DOCKBARE_HOST          public host name for the Traefik labels     (default: backup.example.com)
#   DOCKBARE_DATA_VOLUME / DOCKBARE_BACKUPS_VOLUME   names of the Docker volumes (defaults: dockbare_data / dockbare_backups)
#   TRAEFIK_ENTRYPOINT / TRAEFIK_CERTRESOLVER   (defaults: websecure / letsencrypt)
# plus the application variables from .env.example (DOCKBARE_ADMIN_PASSWORD, keys, ...).
services:
  dockbare:
    build: .                                   # built from this repo by Portainer on every update
    image: dockbare:${DOCKBARE_BUILD:-portainer}
    pull_policy: build                         # never try to pull "dockbare" from a registry; always build
    container_name: dockbare
    restart: unless-stopped
    env_file:
      - path: stack.env
        required: false
    environment:
      - DOCKBARE_BEHIND_PROXY=${DOCKBARE_BEHIND_PROXY:-true}
    volumes:
      # Named Docker volumes: survive every stack update/redeploy regardless of where the checkout lives.
      # Prefer host directories instead? Replace the two lines with absolute paths, e.g.
      #   - /srv/dockbare/backups:/backups
      #   - /srv/dockbare/data:/data
      - dockbare_backups:/backups
      - dockbare_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-true}
      - traefik.docker.network=${PROXY_NETWORK:-proxy-network}
      - traefik.http.routers.dockbare.rule=Host(`${DOCKBARE_HOST:-backup.example.com}`)
      - traefik.http.routers.dockbare.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.dockbare.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.dockbare.loadbalancer.server.port=${DOCKBARE_PORT:-5000}
    # Only if you access it without a reverse proxy:
    # ports:
    #   - "${DOCKBARE_BIND:-127.0.0.1}:${DOCKBARE_PORT:-5000}:${DOCKBARE_PORT:-5000}"

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy-network}

volumes:
  # Fixed names (not prefixed with the stack name) so the data is easy to find and reuse.
  dockbare_data:
    name: ${DOCKBARE_DATA_VOLUME:-dockbare_data}
    labels:
      dev.dockbare.internal: "1"
  dockbare_backups:
    name: ${DOCKBARE_BACKUPS_VOLUME:-dockbare_backups}
    labels:
      dev.dockbare.internal: "1"
