<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in · Dockbare</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="login">
    <div class="brand"><img src="/static/logo.svg" alt=""><span class="name">Dockbare</span></div>
    <div class="card"><div class="card-c">
      <form id="login-form" autocomplete="on">
        <div id="notice"></div>
        <div class="form-group"><label class="field" for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="form-group"><label class="field" for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
        <div class="form-group hidden" id="totp-group"><label class="field" for="totp">One-time code</label><input type="text" id="totp" name="totp" inputmode="numeric" pattern="[0-9 ]*" autocomplete="one-time-code" placeholder="123 456"></div>
        <button class="btn btn-primary" id="submit" type="submit">Sign in</button>
        <div id="error" class="err"></div>
      </form>
    </div></div>
    <p class="muted small center mt">Docker volume backup · encrypted · off-site</p>
  </div>
</div>
<script type="module" src="/static/login.js"></script>
</body>
</html>
